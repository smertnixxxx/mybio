    (function () {
      // --- Monolithic Live Clock ---
      const clockEl = document.getElementById('live-clock');
      const sunStatusEl = document.getElementById('sun-status');
      const sunIconEl = document.getElementById('sun-icon');

      function updateTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        if (clockEl) {
          clockEl.textContent = `${hours}:${minutes}`;
        }

        if (sunStatusEl) {
          const h = now.getHours();
          if (h >= 0 && h < 5) {
            sunStatusEl.textContent = 'night owl';
            if (sunIconEl) sunIconEl.textContent = 'bedtime';
          } else if (h >= 5 && h < 9) {
            sunStatusEl.textContent = 'quiet morning';
            if (sunIconEl) sunIconEl.textContent = 'wb_twilight';
          } else if (h >= 9 && h < 12) {
            sunStatusEl.textContent = 'crisp morning';
            if (sunIconEl) sunIconEl.textContent = 'wb_sunny';
          } else if (h >= 12 && h < 18) {
            sunStatusEl.textContent = 'clear daylight';
            if (sunIconEl) sunIconEl.textContent = 'light_mode';
          } else if (h >= 18 && h < 22) {
            sunStatusEl.textContent = 'calm evening';
            if (sunIconEl) sunIconEl.textContent = 'wb_twilight';
          } else {
            sunStatusEl.textContent = 'still night';
            if (sunIconEl) sunIconEl.textContent = 'dark_mode';
          }
        }
      }

      const playerEl = document.getElementById('music-player');

      const musicSub = document.getElementById('music-sub');
      const eqBars = document.getElementById('eq-bars');
      const mascotWrap = document.getElementById('mascot-wrap');

      function getLiveSchedule() {
        const nowSec = Math.floor(Date.now() / 1000) % totalDur;
        let acc = 0;
        for (let i = 0; i < TRACKS.length; i++) {
          const d = TRACKS[i].dur || 60;
          if (acc + d > nowSec) {
            return { index: i, elapsed: nowSec - acc };
          }
          acc += d;
        }
        return { index: 0, elapsed: 0 };
      }

      function loadTrack(idx, startSec = 0) {
        currentIdx = (idx + TRACKS.length) % TRACKS.length;
        const track = TRACKS[currentIdx];
        const url = 'https://burmalda.wtf/' + encodeURI(track.src);
        audio.src = url;
        if (startSec > 0 && startSec < (track.dur || 60)) {
          audio.currentTime = startSec;
        }
        musicTitle.textContent = track.title;
        musicSub.textContent = 'burmalda.fm • играем';
      }

      function updatePlayState(playing) {
        isPlaying = playing;
        if (playing) {
          musicIcon.textContent = 'pause';
          eqBars.classList.add('is-playing');
          if (mascotWrap) {
            mascotWrap.classList.remove('opacity-0', 'translate-y-6');

        } else {
          musicIcon.textContent = 'play_arrow';
          eqBars.classList.remove('is-playing');
          musicSub.textContent = 'пауза • нажми для старта';
          if (mascotWrap) {
            mascotWrap.classList.remove('opacity-90', 'translate-y-0');
            mascotWrap.classList.add('opacity-0', 'translate-y-6');
          }
        }
      }

      function togglePlay() {
        if (!audio.src) {
          const live = getLiveSchedule();
          loadTrack(live.index, live.elapsed);
        }

        if (audio.paused) {
          audio.play().then(() => {
            updatePlayState(true);
          }).catch(() => {
            updatePlayState(false);
          });
        } else {
          audio.pause();
          updatePlayState(false);
        }
      }

      function playNext() {
        const nextIdx = currentIdx >= 0 ? (currentIdx + 1) % TRACKS.length : 0;
        loadTrack(nextIdx, 0);
        audio.play().then(() => {
          updatePlayState(true);
        }).catch(() => {});
      }

      audio.addEventListener('play', () => updatePlayState(true));
      audio.addEventListener('pause', () => updatePlayState(false));

      });

      playerEl.addEventListener('click', (e) => {
        if (e.target.closest('#music-next-btn')) {
          e.stopPropagation();
          playNext();
          return;

        togglePlay();

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playNext();
